name: TrainerHealth
options:
  bundleIdPrefix: me.ycross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  TrainerHealth:
    type: application
    platform: iOS
    sources:
      - path: TrainerHealth
        excludes:
          - "**/*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ycross.trainer-health
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trainer Health
        INFOPLIST_KEY_NSHealthShareUsageDescription: Trainer Health reads Apple Health to build a doctor-visit summary and to avoid writing duplicate samples.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Trainer Health writes weight, workouts, protein, sleep, waist, and symptoms from your training log into Apple Health.
        INFOPLIST_KEY_NSCameraUsageDescription: Trainer Health uses the camera to photograph a meal or a nutrition label, and to scan a setup code.
        INFOPLIST_FILE: TrainerHealth/Info.plist
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Trainer Health uses a photo you choose of a meal or a nutrition label.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: TrainerHealth/TrainerHealth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
